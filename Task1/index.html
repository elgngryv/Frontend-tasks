<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mənim Səhifəm</title>
  </head>
  <body>
    <!-- Başlıq -->
    <h1>Elgün Qarayev</h1>

    <!-- Haqqımda -->
    <p>Mən proqramlaşdırma öyrənirəm və frontend developer olmaq istəyirəm.</p>

    <!-- Sevdiyim yeməklər -->
    <h2>Sevdiyim yeməklər</h2>
    <ul>
      <li>Pizza</li>
      <li>Döner</li>
      <li>Plov</li>
    </ul>

    <!-- Gündəlik işlərim -->
    <h2>Gündəlik işlərim</h2>
    <ol>
      <li>Dərs oxumaq</li>
      <li>İdman etmək</li>
      <li>Film izləmək</li>
    </ol>

    <!-- Link -->
    <h2>Sevdiyim sayt</h2>
    <a href="https://www.youtube.com" target="_blank">YouTube</a>
    <a href="https://www.wikipedia.org" target="_blank">Vikipediya</a>

    <!-- Şəkil -->
    <h2>Sevdiyim şəkil</h2>
    <img src="https://via.placeholder.com/200" alt="Şəkil" />

    <!-- Video -->
    <h2>Video</h2>
    <video width="300" controls>
      <source src="video.mp4" type="video/mp4" />
    </video>

    <!-- Audio -->
    <h2>Audio</h2>
    <audio controls>
      <source src="audio.mp3" type="audio/mpeg" />
    </audio>
  </body>
</html>
